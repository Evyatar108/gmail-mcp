[project]
name = "gmail-mcp"
version = "0.1.0"
description = "Local Gmail MCP server for GitHub Copilot CLI"
readme = "README.md"
authors = [
    { name = "Gmail MCP contributors" }
]
requires-python = ">=3.12"
dependencies = [
    "anyio>=4.14.2",
    "certifi>=2026.6.17",
    "google-api-python-client>=2.198.0",
    "google-auth-httplib2>=0.4.0",
    "google-auth-oauthlib>=1.4.0",
    "keyring>=25.7.0",
    "mcp[cli]>=1.28.1",
    "requests>=2.34.2",
]

[project.scripts]
gmail-mcp = "gmail_mcp.cli:main"

[build-system]
requires = ["uv_build>=0.11.3,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
